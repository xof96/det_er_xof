[project]
name = "personal-atlas-backend"
version = "0.1.0"
description = "FastAPI backend for Personal Atlas — sections, projects, GitHub integration and contact."
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
